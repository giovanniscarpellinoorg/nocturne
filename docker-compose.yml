services:
  nocturne:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${NOCTURNE_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      PORT: 4173
      NOCTURNE_HOST: 0.0.0.0
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ./private:/app/.private
    restart: unless-stopped
